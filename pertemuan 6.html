<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz App</title>
<style>
  :root {
    --bg: #f3f5fb; --card: #ffffff; --text: #1c2540; --muted: #6b7491;
    --border: #d9deee; --accent: #4f46e5; --good: #16a34a; --good-bg: #dcfce7;
    --bad: #dc2626; --bad-bg: #fee2e2;
  }
  [data-theme="dark"] {
    --bg: #0f1424; --card: #1a2038; --text: #e8ebf7; --muted: #93a0c4;
    --border: #2e3758; --accent: #818cf8; --good: #4ade80; --good-bg: #123524;
    --bad: #f87171; --bad-bg: #3b1620;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .3s, color .3s;
  }
  .quiz-container {
    width: 100%; max-width: 560px; padding: 24px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border);
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.35rem; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon-btn { border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 10px; padding: 6px 10px; }

  .meta { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
  .timer.low { color: var(--bad); font-weight: 700; }
  .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; margin-bottom: 20px; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  .quiz-content.enter { animation: slideIn .35s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

  .category { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 99px;
    background: var(--border); color: var(--muted); margin-bottom: 10px; }
  #question { font-size: 1.15rem; line-height: 1.45; margin-bottom: 16px; }
  .options-grid { display: grid; gap: 10px; }
  .option-btn {
    text-align: left; padding: 13px 14px; border-radius: 12px; color: var(--text);
    background: transparent; border: 2px solid var(--border); transition: border-color .15s, background .15s;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--good); background: var(--good-bg); }
  .option-btn.wrong { border-color: var(--bad); background: var(--bad-bg); }

  .primary { margin-top: 18px; width: 100%; padding: 13px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 600; }
  #feedback { margin-top: 14px; min-height: 1.2em; font-size: .95rem; color: var(--muted); }

  #result { text-align: center; padding: 8px 0; }
  #result h2 { font-size: 1.6rem; margin-bottom: 8px; }
  #result p { color: var(--muted); margin-bottom: 4px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="quiz-container">
  <header>
    <h1>🧠 Interactive Quiz</h1>
    <button id="themeBtn" class="icon-btn" aria-label="Ganti tema">🌙</button>
  </header>

  <div class="quiz-content">
    <div class="meta">
      <span id="progress">Soal 1/10</span>
      <span id="timer" class="timer">⏱ 15</span>
    </div>
    <div class="bar" role="progressbar" aria-label="Progres quiz"><div id="barFill" class="bar-fill"></div></div>

    <div id="category" class="category"></div>
    <div id="question"></div>
    <div id="options" class="options-grid"></div>
    <div id="feedback" role="status"></div>
    <button id="nextBtn" class="primary hidden">Next →</button>
  </div>

  <div id="result" class="hidden">
    <h2>Skor: <span id="score"></span></h2>
    <p>High Score: <span id="highScore"></span></p>
    <button id="restartBtn" class="primary">🔄 Ulangi</button>
  </div>
</div>

<script>
// ============================================================
// Interactive Quiz App — Tugas Rutin 6 (Pemrograman Web)
// ============================================================

const TIME_PER_QUESTION = 15; // detik
const HIGH_SCORE_KEY = 'quizHighScore';
const THEME_KEY = 'quizTheme';

// Bank soal (kategori + urutan soal diacak setiap kali quiz dimulai)
const questionBank = [
  { category: 'HTML', question: 'Apa kepanjangan dari HTML?',
    options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Home Tool Markup Language', 'Hyperlink Text Mode Language'], correct: 0 },
  { category: 'HTML', question: 'Tag HTML5 yang tepat untuk bagian navigasi situs adalah...',
    options: ['<menu>', '<nav>', '<navigate>', '<links>'], correct: 1 },
  { category: 'CSS', question: 'CSS digunakan untuk?',
    options: ['Struktur halaman', 'Styling tampilan', 'Logika program', 'Database'], correct: 1 },
  { category: 'CSS', question: 'Properti CSS untuk membuat layout dua dimensi berbasis baris dan kolom adalah...',
    options: ['display: grid', 'display: inline', 'float: both', 'position: static'], correct: 0 },
  { category: 'SASS', question: 'Simbol yang dipakai untuk mendeklarasikan variabel di SASS/SCSS adalah...',
    options: ['@', '#', '$', '%'], correct: 2 },
  { category: 'JavaScript', question: 'Keyword mana yang membuat variabel tidak bisa di-reassign?',
    options: ['var', 'let', 'const', 'static'], correct: 2 },
  { category: 'JavaScript', question: 'Hasil dari [1, 2, 3].map(n => n * 2) adalah...',
    options: ['[1, 2, 3]', '[2, 4, 6]', '6', '[2, 3]'], correct: 1 },
  { category: 'JavaScript', question: 'Method array yang menyaring item berdasarkan kondisi adalah...',
    options: ['map()', 'reduce()', 'filter()', 'push()'], correct: 2 },
  { category: 'JavaScript', question: 'Keyword yang hanya boleh dipakai di dalam async function adalah...',
    options: ['yield', 'await', 'defer', 'then'], correct: 1 },
  { category: 'DOM', question: 'Method untuk memilih elemen pertama yang cocok dengan CSS selector adalah...',
    options: ['getElementsByTag()', 'querySelector()', 'selectOne()', 'findElement()'], correct: 1 },
];

// ---------- State ----------
const state = { questions: [], current: 0, score: 0, answered: false, timeLeft: TIME_PER_QUESTION, timerId: null };

// ---------- DOM Elements ----------
const quizContent = document.querySelector('.quiz-content');
const progressEl = document.querySelector('#progress');
const timerEl = document.querySelector('#timer');
const barFill = document.querySelector('#barFill');
const categoryEl = document.querySelector('#category');
const questionEl = document.querySelector('#question');
const optionsEl = document.querySelector('#options');
const feedbackEl = document.querySelector('#feedback');
const nextBtn = document.querySelector('#nextBtn');
const resultEl = document.querySelector('#result');
const themeBtn = document.querySelector('#themeBtn');

// ---------- Helper ----------
// Fisher-Yates shuffle pada salinan array
const shuffle = (arr) => {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
};

const readStorage = (key) => {
  try { return localStorage.getItem(key); } catch { return null; }
};
const writeStorage = (key, value) => {
  try { localStorage.setItem(key, value); } catch { /* diabaikan */ }
};

// ---------- Timer ----------
const stopTimer = () => clearInterval(state.timerId);

const updateTimer = () => {
  timerEl.textContent = `⏱ ${state.timeLeft}`;
  timerEl.classList.toggle('low', state.timeLeft <= 5);
};

const startTimer = () => {
  stopTimer();
  state.timeLeft = TIME_PER_QUESTION;
  updateTimer();
  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) handleAnswer(-1); // waktu habis = dianggap salah
  }, 1000);
};

// ---------- Render soal ----------
const renderQuestion = () => {
  const { questions, current } = state;
  const q = questions[current];
  state.answered = false;

  progressEl.textContent = `Soal ${current + 1}/${questions.length}`;
  barFill.style.width = `${(current / questions.length) * 100}%`;
  categoryEl.textContent = q.category;
  questionEl.textContent = q.question;
  feedbackEl.textContent = '';

  // Clear & render options (data-index untuk event delegation)
  optionsEl.innerHTML = '';
  q.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.textContent = option;
    btn.classList.add('option-btn');
    btn.dataset.index = index;
    optionsEl.append(btn);
  });

  nextBtn.textContent = current === questions.length - 1 ? 'Lihat Hasil →' : 'Next →';
  nextBtn.classList.add('hidden');

  // Animasi transisi antar soal
  quizContent.classList.remove('enter');
  void quizContent.offsetWidth; // restart animasi
  quizContent.classList.add('enter');

  startTimer();
};

// ---------- Jawaban ----------
const handleAnswer = (selectedIndex) => {
  if (state.answered) return;
  state.answered = true;
  stopTimer();

  const { correct } = state.questions[state.current];
  const buttons = [...optionsEl.querySelectorAll('.option-btn')];

  buttons.forEach((btn) => { btn.disabled = true; });
  buttons[correct].classList.add('correct');

  if (selectedIndex === correct) {
    state.score++;
    feedbackEl.textContent = '✅ Benar!';
  } else {
    if (selectedIndex >= 0) buttons[selectedIndex].classList.add('wrong');
    feedbackEl.textContent = selectedIndex === -1 ? '⏰ Waktu habis. Jawaban benar ditandai hijau.' : '❌ Salah. Jawaban benar ditandai hijau.';
  }

  nextBtn.classList.remove('hidden');
};

// Event Delegation: satu listener untuk semua tombol pilihan
optionsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.option-btn');
  if (!btn) return;
  handleAnswer(Number(btn.dataset.index));
});

// ---------- Navigasi ----------
nextBtn.addEventListener('click', () => {
  state.current++;
  if (state.current < state.questions.length) renderQuestion();
  else showResult();
});

// ---------- Hasil & High Score ----------
const showResult = () => {
  const total = state.questions.length;
  const percentage = Math.round((state.score / total) * 100);
  document.querySelector('#score').textContent = `${state.score}/${total} (${percentage}%)`;

  const savedHighScore = parseInt(readStorage(HIGH_SCORE_KEY)) || 0;
  const highScoreEl = document.querySelector('#highScore');
  if (percentage > savedHighScore) {
    writeStorage(HIGH_SCORE_KEY, percentage);
    highScoreEl.textContent = `${percentage}% 🎉 New Record!`;
  } else {
    highScoreEl.textContent = `${savedHighScore}%`;
  }

  barFill.style.width = '100%';
  quizContent.classList.add('hidden');
  resultEl.classList.remove('hidden');
};

// ---------- Restart ----------
const startQuiz = () => {
  state.questions = shuffle(questionBank);
  state.current = 0;
  state.score = 0;
  resultEl.classList.add('hidden');
  quizContent.classList.remove('hidden');
  renderQuestion();
};
document.querySelector('#restartBtn').addEventListener('click', startQuiz);

// ---------- Dark mode ----------
const applyTheme = (theme) => {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
};
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  writeStorage(THEME_KEY, next);
});

// ---------- Inisialisasi ----------
applyTheme(readStorage(THEME_KEY) ?? 'light');
startQuiz();
</script>
</body>
</html>
